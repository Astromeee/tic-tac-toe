<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #fbfbfa;
      --ink: #2f3437;
      --muted: #787774;
      --panel: #ffffff;
      --soft: #f7f6f3;
      --line: #e9e9e7;
      --line-strong: #d9d9d6;
      --x: #337ea9;
      --o: #d9730d;
      --accent: #37352f;
      --accent-hover: #2a2925;
      --win: #fbf3db;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      padding: 24px;
    }

    main {
      width: min(92vw, 430px);
      padding: 26px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.7rem, 7vw, 2.25rem);
      line-height: 1.08;
      text-align: left;
      font-weight: 750;
    }

    .status {
      min-height: 28px;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.98rem;
      font-weight: 550;
      text-align: left;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .score {
      padding: 9px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      text-align: center;
      background: var(--soft);
    }

    .score span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 600;
    }

    .score strong {
      display: block;
      margin-top: 3px;
      font-size: 1.18rem;
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      aspect-ratio: 1;
      margin: 0 auto 16px;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-size: clamp(2.8rem, 17vw, 5rem);
      font-weight: 650;
      line-height: 1;
      transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
    }

    .cell:hover:not(:disabled),
    .cell:focus-visible {
      border-color: var(--line-strong);
      background: var(--soft);
      box-shadow: inset 0 0 0 1px var(--line);
      outline: none;
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.x {
      color: var(--x);
    }

    .cell.o {
      color: var(--o);
    }

    .cell.win {
      border-color: #e8dca9;
      background: var(--win);
      color: var(--accent);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button.action {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--soft);
      color: var(--accent);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 650;
    }

    button.action:hover,
    button.action:focus-visible {
      border-color: var(--line-strong);
      background: #efeeeb;
      outline: 3px solid rgba(55, 53, 47, 0.12);
      outline-offset: 2px;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .confetti {
      position: absolute;
      top: -12px;
      left: 50%;
      width: 8px;
      height: 12px;
      border-radius: 2px;
      opacity: 0;
      animation: confetti-fall 900ms cubic-bezier(0.18, 0.8, 0.32, 1) forwards;
      transform: translate3d(0, 0, 0) rotate(0deg);
    }

    @keyframes confetti-fall {
      0% {
        opacity: 1;
        transform: translate3d(0, -8px, 0) rotate(0deg);
      }

      100% {
        opacity: 0;
        transform: translate3d(var(--x-shift), 58vh, 0) rotate(var(--spin));
      }
    }

    @media (max-width: 380px) {
      main {
        padding: 18px;
      }

      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>
  <main>
    <h1>Tic Tac Toe</h1>
    <p class="status" id="status" aria-live="polite">Player X's turn</p>

    <section class="scoreboard" aria-label="Scoreboard">
      <div class="score">
        <span>Player X</span>
        <strong id="score-x">0</strong>
      </div>
      <div class="score">
        <span>Draws</span>
        <strong id="score-draw">0</strong>
      </div>
      <div class="score">
        <span>Player O</span>
        <strong id="score-o">0</strong>
      </div>
    </section>

    <section class="board" aria-label="Tic Tac Toe board">
      <button class="cell" type="button" aria-label="Row 1, column 1" data-cell></button>
      <button class="cell" type="button" aria-label="Row 1, column 2" data-cell></button>
      <button class="cell" type="button" aria-label="Row 1, column 3" data-cell></button>
      <button class="cell" type="button" aria-label="Row 2, column 1" data-cell></button>
      <button class="cell" type="button" aria-label="Row 2, column 2" data-cell></button>
      <button class="cell" type="button" aria-label="Row 2, column 3" data-cell></button>
      <button class="cell" type="button" aria-label="Row 3, column 1" data-cell></button>
      <button class="cell" type="button" aria-label="Row 3, column 2" data-cell></button>
      <button class="cell" type="button" aria-label="Row 3, column 3" data-cell></button>
    </section>

    <div class="controls">
      <button class="action" type="button" id="restart">Restart round</button>
      <button class="action" type="button" id="reset">Reset scores</button>
    </div>
  </main>

  <script>
    const cells = Array.from(document.querySelectorAll("[data-cell]"));
    const statusText = document.querySelector("#status");
    const restartButton = document.querySelector("#restart");
    const resetButton = document.querySelector("#reset");
    const confettiLayer = document.querySelector("#confetti-layer");
    const scoreX = document.querySelector("#score-x");
    const scoreO = document.querySelector("#score-o");
    const scoreDraw = document.querySelector("#score-draw");
    const confettiColors = ["#337ea9", "#d9730d", "#448361", "#cb912f", "#9f6b53"];

    const winningLines = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    let board = Array(9).fill("");
    let currentPlayer = "X";
    let gameOver = false;
    let scores = {
      X: 0,
      O: 0,
      draw: 0
    };

    function updateStatus(message) {
      statusText.textContent = message;
    }

    function updateScores() {
      scoreX.textContent = scores.X;
      scoreO.textContent = scores.O;
      scoreDraw.textContent = scores.draw;
    }

    function getWinningLine() {
      return winningLines.find(function(line) {
        const first = board[line[0]];
        return first && line.every(function(index) {
          return board[index] === first;
        });
      });
    }

    function celebrateRound() {
      confettiLayer.innerHTML = "";

      for (let index = 0; index < 42; index += 1) {
        const piece = document.createElement("span");
        const drift = Math.round(Math.random() * 360 - 180);
        const start = Math.round(Math.random() * 80 + 10);
        const delay = Math.round(Math.random() * 160);
        const duration = Math.round(Math.random() * 450 + 750);

        piece.className = "confetti";
        piece.style.left = start + "%";
        piece.style.background = confettiColors[index % confettiColors.length];
        piece.style.animationDelay = delay + "ms";
        piece.style.animationDuration = duration + "ms";
        piece.style.setProperty("--x-shift", drift + "px");
        piece.style.setProperty("--spin", Math.round(Math.random() * 540 + 180) + "deg");
        confettiLayer.appendChild(piece);
      }

      window.setTimeout(function() {
        confettiLayer.innerHTML = "";
      }, 1400);
    }

    function endGame(winningLine) {
      gameOver = true;

      if (winningLine) {
        const winner = board[winningLine[0]];
        scores[winner] += 1;
        winningLine.forEach(function(index) {
          cells[index].classList.add("win");
        });
        updateStatus("Player " + winner + " wins!");
      } else {
        scores.draw += 1;
        updateStatus("It's a draw!");
      }

      updateScores();
      celebrateRound();
      cells.forEach(function(cell) {
        cell.disabled = true;
      });
    }

    function handleMove(event) {
      const cell = event.currentTarget;
      const index = cells.indexOf(cell);

      if (gameOver || board[index]) {
        return;
      }

      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.disabled = true;
      cell.classList.add(currentPlayer.toLowerCase());
      cell.setAttribute("aria-label", cell.getAttribute("aria-label") + ", " + currentPlayer);

      const winningLine = getWinningLine();
      if (winningLine) {
        endGame(winningLine);
        return;
      }

      if (board.every(Boolean)) {
        endGame(null);
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus("Player " + currentPlayer + "'s turn");
    }

    function startRound() {
      board = Array(9).fill("");
      currentPlayer = "X";
      gameOver = false;
      updateStatus("Player X's turn");

      cells.forEach(function(cell, index) {
        const row = Math.floor(index / 3) + 1;
        const column = index % 3 + 1;
        cell.textContent = "";
        cell.disabled = false;
        cell.className = "cell";
        cell.setAttribute("aria-label", "Row " + row + ", column " + column);
      });
    }

    function resetMatch() {
      scores = {
        X: 0,
        O: 0,
        draw: 0
      };
      updateScores();
      startRound();
    }

    cells.forEach(function(cell) {
      cell.addEventListener("click", handleMove);
    });

    restartButton.addEventListener("click", startRound);
    resetButton.addEventListener("click", resetMatch);
  </script>
</body>
</html>
