<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d25">
  <meta name="description" content="Arcade Break — quick browser games for breaks between classes.">
  <title>Arcade Break — Tic-Tac-Toe</title>
  <style>
    :root {
      --cabinet: #080d25;
      --panel: #111b43;
      --raised: #192755;
      --raised-hover: #223266;
      --lime: #b9f227;
      --lime-deep: #7cae0a;
      --amber: #ffaa19;
      --amber-deep: #c66d00;
      --blue: #62d9ff;
      --white: #f5f7ff;
      --muted: #b8c4ea;
      --line: #405385;
      --line-soft: #293865;
      --shadow: #050817;
      --font-pixel: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --font-ui: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      background: var(--cabinet);
      color: var(--white);
      font-family: var(--font-ui);
    }

    button { font: inherit; }

    button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }

    .site-header {
      border-bottom: 1px solid var(--line-soft);
      background: #0b1230;
    }

    .header-inner {
      width: min(1120px, calc(100% - 32px));
      min-height: 68px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--lime);
      font-family: var(--font-pixel);
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      grid-template-columns: repeat(2, 6px);
      gap: 3px;
      transform: rotate(45deg);
    }

    .brand-mark span { width: 6px; height: 6px; background: currentColor; }

    .header-note { margin: 0; color: var(--muted); font-size: 0.86rem; }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .game-picker { margin-bottom: 24px; }

    .section-label {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: var(--font-pixel);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .game-list {
      display: flex;
      gap: 10px;
      margin: 0;
      padding: 0 0 5px;
      overflow-x: auto;
      list-style: none;
      scrollbar-color: var(--line) transparent;
    }

    .game-tab {
      min-width: 190px;
      min-height: 62px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--white);
      padding: 10px 14px;
      text-align: left;
      box-shadow: 0 4px 0 var(--shadow);
    }

    .game-tab.active { border-color: var(--lime); box-shadow: 0 4px 0 var(--lime-deep); }
    .game-tab[disabled] { color: var(--muted); cursor: not-allowed; opacity: 0.68; }

    .tab-icon {
      width: 34px;
      flex: 0 0 34px;
      color: var(--lime);
      font-family: var(--font-pixel);
      font-size: 1rem;
      font-weight: 900;
      line-height: 0.8;
      text-align: center;
    }

    .game-tab[disabled] .tab-icon { color: var(--muted); }
    .tab-copy { display: grid; gap: 3px; }
    .tab-copy strong { font-family: var(--font-pixel); font-size: 0.78rem; text-transform: uppercase; }
    .tab-copy small { color: var(--muted); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }

    .game-shell {
      position: relative;
      display: grid;
      grid-template-columns: minmax(160px, 210px) minmax(290px, 520px) minmax(160px, 210px);
      justify-content: center;
      gap: clamp(18px, 4vw, 44px);
      padding: clamp(18px, 3vw, 34px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .game-shell::after {
      content: "";
      position: absolute;
      right: 22px;
      bottom: 18px;
      width: 5px;
      height: 5px;
      background: var(--blue);
      box-shadow: 14px 0 var(--blue), 7px -7px var(--blue), 7px 7px var(--blue);
      opacity: 0.35;
    }

    .score-panel, .control-panel { align-self: center; }

    .score-list { display: grid; gap: 10px; }

    .score {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--raised);
    }

    .score.x { border-color: var(--lime-deep); }
    .score.o { border-color: var(--amber-deep); }

    .score span {
      color: var(--muted);
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .score strong { font-family: var(--font-pixel); font-size: 1.65rem; line-height: 1; }
    .score.x strong { color: var(--lime); }
    .score.o strong { color: var(--amber); }

    .play-area { min-width: 0; text-align: center; }

    h1 {
      margin: 0 0 8px;
      font-family: var(--font-pixel);
      font-size: clamp(1.45rem, 4vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      text-wrap: balance;
      text-transform: uppercase;
    }

    .status {
      min-height: 27px;
      margin: 0 0 18px;
      color: var(--lime);
      font-family: var(--font-pixel);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .status[data-player="O"] { color: var(--amber); }
    .status[data-player="draw"] { color: var(--blue); }

    .board {
      width: min(100%, 480px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin: 0 auto;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0c1435;
    }

    .cell {
      width: 100%;
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--raised);
      color: var(--white);
      cursor: pointer;
      font-family: var(--font-pixel);
      font-size: clamp(2.1rem, 9vw, 4.5rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 3px 3px 0 var(--shadow);
      transition: transform 180ms var(--ease-out), background 180ms ease, border-color 180ms ease;
    }

    .cell:hover:not(:disabled) { border-color: var(--blue); background: var(--raised-hover); transform: translateY(-2px); }
    .cell:active:not(:disabled) { transform: translateY(1px); }
    .cell:disabled { cursor: default; }
    .cell.x { color: var(--lime); }
    .cell.o { color: var(--amber); }
    .cell.placed { animation: place-mark 220ms var(--ease-out); }
    .cell.win { border-color: var(--blue); background: #263d6b; box-shadow: inset 0 0 0 2px var(--blue); animation: win-pulse 700ms ease-in-out 2; }

    .hint { margin: 14px 0 0; color: var(--muted); font-size: 0.82rem; }

    .controls { display: grid; gap: 12px; }

    .action {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--raised);
      color: var(--white);
      cursor: pointer;
      font-family: var(--font-pixel);
      font-size: 0.74rem;
      font-weight: 850;
      text-transform: uppercase;
      box-shadow: 0 4px 0 var(--shadow);
      transition: transform 160ms var(--ease-out), background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .action.primary { border-color: var(--lime); background: var(--lime); color: var(--cabinet); box-shadow: 0 4px 0 var(--lime-deep); }
    .action:hover { border-color: var(--blue); background: var(--raised-hover); transform: translateY(-1px); }
    .action.primary:hover { border-color: var(--lime); background: #ceff4f; }
    .action:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }

    .confetti-layer { position: fixed; inset: 0; z-index: 10; overflow: hidden; pointer-events: none; }
    .confetti { position: absolute; top: -14px; width: 8px; height: 12px; opacity: 0; animation: confetti-fall 900ms var(--ease-out) forwards; }

    @keyframes place-mark { from { opacity: 0.25; transform: scale(0.65); } to { opacity: 1; transform: scale(1); } }
    @keyframes win-pulse { 50% { background: #315187; transform: translateY(-2px); } }
    @keyframes confetti-fall { 0% { opacity: 1; transform: translate3d(0, -8px, 0) rotate(0); } 100% { opacity: 0; transform: translate3d(var(--drift), 65vh, 0) rotate(var(--spin)); } }

    @media (max-width: 820px) {
      .game-shell { grid-template-columns: minmax(0, 1fr) minmax(130px, 180px); }
      .play-area { grid-row: span 2; }
      .score-panel, .control-panel { align-self: auto; }
      .score { min-height: 64px; }
    }

    @media (max-width: 600px) {
      .header-inner, main { width: min(100% - 24px, 1120px); }
      .header-note { display: none; }
      main { padding-top: 20px; }
      .game-list { margin-right: -12px; }
      .game-tab { min-width: 158px; min-height: 58px; }
      .game-shell { grid-template-columns: 1fr; gap: 18px; padding: 16px; }
      .play-area { grid-row: auto; }
      .score-panel { order: 2; }
      .control-panel { order: 3; }
      .score-list { grid-template-columns: repeat(3, 1fr); }
      .score { min-width: 0; min-height: 66px; display: grid; justify-items: center; gap: 5px; padding: 9px 4px; }
      .score span { font-size: 0.61rem; }
      .score strong { font-size: 1.35rem; }
      .controls { grid-template-columns: 1fr 1fr; }
      .cell { font-size: clamp(2.2rem, 17vw, 4rem); }
      .hint { display: none; }
    }

    @media (max-width: 340px) {
      .header-inner, main { width: min(100% - 16px, 1120px); }
      .game-shell { padding: 12px; }
      .controls { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      .confetti-layer { display: none; }
    }
  </style>
</head>
<body>
  <div class="confetti-layer" id="confetti-layer" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand" aria-label="Arcade Break">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        Arcade Break
      </div>
      <p class="header-note">Quick games for the gap between classes.</p>
    </div>
  </header>

  <main>
    <nav class="game-picker" aria-label="Choose a game">
      <p class="section-label">Choose a game</p>
      <ul class="game-list">
        <li>
          <button class="game-tab active" type="button" aria-current="page">
            <span class="tab-icon" aria-hidden="true">X O</span>
            <span class="tab-copy"><strong>Tic-Tac-Toe</strong><small>Now playing</small></span>
          </button>
        </li>
        <li>
          <button class="game-tab" type="button" disabled>
            <span class="tab-icon" aria-hidden="true">▣</span>
            <span class="tab-copy"><strong>Memory</strong><small>Coming soon</small></span>
          </button>
        </li>
        <li>
          <button class="game-tab" type="button" disabled>
            <span class="tab-icon" aria-hidden="true">••■</span>
            <span class="tab-copy"><strong>Snake</strong><small>Coming soon</small></span>
          </button>
        </li>
      </ul>
    </nav>

    <section class="game-shell" aria-labelledby="game-title">
      <aside class="score-panel" aria-label="Scoreboard">
        <p class="section-label">Match score</p>
        <div class="score-list">
          <div class="score x"><span>Player X</span><strong id="score-x">0</strong></div>
          <div class="score"><span>Draws</span><strong id="score-draw">0</strong></div>
          <div class="score o"><span>Player O</span><strong id="score-o">0</strong></div>
        </div>
      </aside>

      <div class="play-area">
        <h1 id="game-title">Tic-Tac-Toe</h1>
        <p class="status" id="status" data-player="X" aria-live="polite">Player X's turn</p>
        <div class="board" role="group" aria-label="Tic-Tac-Toe board">
          <button class="cell" type="button" aria-label="Row 1, column 1, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 1, column 2, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 1, column 3, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 2, column 1, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 2, column 2, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 2, column 3, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 3, column 1, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 3, column 2, empty" data-cell></button>
          <button class="cell" type="button" aria-label="Row 3, column 3, empty" data-cell></button>
        </div>
        <p class="hint">Get three marks in a row to win.</p>
      </div>

      <aside class="control-panel" aria-label="Game controls">
        <p class="section-label">Controls</p>
        <div class="controls">
          <button class="action primary" type="button" id="restart">Restart round</button>
          <button class="action" type="button" id="reset">Reset scores</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const cells = Array.from(document.querySelectorAll("[data-cell]"));
    const statusText = document.querySelector("#status");
    const restartButton = document.querySelector("#restart");
    const resetButton = document.querySelector("#reset");
    const confettiLayer = document.querySelector("#confetti-layer");
    const scoreX = document.querySelector("#score-x");
    const scoreO = document.querySelector("#score-o");
    const scoreDraw = document.querySelector("#score-draw");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const confettiColors = ["#b9f227", "#ffaa19", "#62d9ff", "#f5f7ff"];
    const winningLines = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];

    let board = Array(9).fill("");
    let currentPlayer = "X";
    let gameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };

    function updateStatus(message, state) {
      statusText.textContent = message;
      statusText.dataset.player = state;
    }

    function updateScores() {
      scoreX.textContent = scores.X;
      scoreO.textContent = scores.O;
      scoreDraw.textContent = scores.draw;
    }

    function getWinningLine() {
      return winningLines.find(function(line) {
        const first = board[line[0]];
        return first && line.every(function(index) { return board[index] === first; });
      });
    }

    function celebrateRound() {
      if (reducedMotion.matches) return;
      confettiLayer.replaceChildren();

      for (let index = 0; index < 34; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = Math.round(Math.random() * 80 + 10) + "%";
        piece.style.background = confettiColors[index % confettiColors.length];
        piece.style.animationDelay = Math.round(Math.random() * 140) + "ms";
        piece.style.setProperty("--drift", Math.round(Math.random() * 320 - 160) + "px");
        piece.style.setProperty("--spin", Math.round(Math.random() * 540 + 180) + "deg");
        confettiLayer.appendChild(piece);
      }

      window.setTimeout(function() { confettiLayer.replaceChildren(); }, 1300);
    }

    function endGame(winningLine) {
      gameOver = true;

      if (winningLine) {
        const winner = board[winningLine[0]];
        scores[winner] += 1;
        winningLine.forEach(function(index) { cells[index].classList.add("win"); });
        updateStatus("Player " + winner + " wins!", winner);
      } else {
        scores.draw += 1;
        updateStatus("Round draw — good game!", "draw");
      }

      updateScores();
      celebrateRound();
      cells.forEach(function(cell) { cell.disabled = true; });
    }

    function handleMove(event) {
      const cell = event.currentTarget;
      const index = cells.indexOf(cell);
      if (gameOver || board[index]) return;

      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.disabled = true;
      cell.classList.add(currentPlayer.toLowerCase(), "placed");
      cell.setAttribute("aria-label", cell.getAttribute("aria-label").replace("empty", "marked " + currentPlayer));

      const winningLine = getWinningLine();
      if (winningLine) return endGame(winningLine);
      if (board.every(Boolean)) return endGame(null);

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus("Player " + currentPlayer + "'s turn", currentPlayer);
    }

    function startRound() {
      board = Array(9).fill("");
      currentPlayer = "X";
      gameOver = false;
      updateStatus("Player X's turn", "X");

      cells.forEach(function(cell, index) {
        const row = Math.floor(index / 3) + 1;
        const column = index % 3 + 1;
        cell.textContent = "";
        cell.disabled = false;
        cell.className = "cell";
        cell.setAttribute("aria-label", "Row " + row + ", column " + column + ", empty");
      });
      cells[0].focus();
    }

    function resetMatch() {
      scores = { X: 0, O: 0, draw: 0 };
      updateScores();
      startRound();
    }

    cells.forEach(function(cell) { cell.addEventListener("click", handleMove); });
    restartButton.addEventListener("click", startRound);
    resetButton.addEventListener("click", resetMatch);
  </script>
</body>
</html>
