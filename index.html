<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07102d">
  <meta name="description" content="Arcade Break — quick browser games for breaks between classes.">
  <title>Arcade Break — Tic-Tac-Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,700,1,0" rel="stylesheet">
  <style>
    :root {
      --night: #050a1d;
      --cabinet: #091334;
      --panel: #0d1941;
      --raised: #152653;
      --raised-hover: #1b3064;
      --lime: #b9ed2b;
      --lime-dark: #668f0b;
      --amber: #ffa51f;
      --amber-dark: #a85905;
      --ice: #b9d8ff;
      --white: #f6f7ff;
      --muted: #aebcde;
      --line: #3f568a;
      --line-soft: #263b70;
      --shadow: #020513;
      --pixel: "Press Start 2P", ui-monospace, monospace;
      --mono: "Space Mono", ui-monospace, monospace;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html { background: var(--night); }

    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      padding: clamp(10px, 2vw, 26px);
      background: var(--night);
      color: var(--white);
      font-family: var(--mono);
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }

    .arcade-cabinet {
      position: relative;
      width: min(1160px, 100%);
      min-height: calc(100vh - clamp(20px, 4vw, 52px));
      margin: 0 auto;
      overflow: hidden;
      border: 2px solid #334878;
      border-radius: 14px;
      background: var(--cabinet);
      box-shadow: 0 7px 0 #01030c;
      isolation: isolate;
    }

    .site-header {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 22px;
      border-bottom: 2px solid #1d3263;
      background: #08122f;
    }

    .brand {
      color: var(--lime);
      font-family: var(--pixel);
      font-size: clamp(.95rem, 2.6vw, 1.45rem);
      line-height: 1.35;
      text-shadow: 3px 3px 0 #294314;
    }

    .brand::before,
    .brand::after { content: "+"; margin: 0 10px; font-size: .7em; }

    .menu-button {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 48px;
      border: 2px solid var(--line);
      border-radius: 3px;
      background: var(--raised);
      color: var(--white);
      cursor: pointer;
      box-shadow: 3px 3px 0 #29447d;
      transition: transform 150ms var(--ease), background 150ms ease;
    }

    .menu-button:hover { background: var(--raised-hover); }
    .menu-button:active { transform: translate(3px, 3px); box-shadow: none; }
    .material-symbols-rounded { font-size: 28px; font-variation-settings: "FILL" 1, "wght" 700, "GRAD" 0, "opsz" 24; }

    main { position: relative; z-index: 2; padding: 14px 22px 28px; }

    .section-label {
      margin: 0 0 10px;
      color: var(--white);
      font-family: var(--mono);
      font-size: .77rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .game-picker {
      padding-bottom: 12px;
      border-bottom: 1px solid #253967;
      transition: max-height 220ms var(--ease), opacity 180ms ease, padding 220ms var(--ease);
    }

    .game-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      max-width: 820px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .game-tab {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 2px solid var(--line);
      border-radius: 2px;
      padding: 8px 12px;
      background: var(--raised);
      color: var(--white);
      text-align: left;
      box-shadow: 4px 4px 0 #07102a;
    }

    .game-tab.active { border-color: var(--lime); box-shadow: 4px 4px 0 var(--lime-dark); }
    .game-tab[disabled] { color: var(--muted); cursor: not-allowed; opacity: .72; }
    .tab-icon { width: 34px; flex: 0 0 34px; display: grid; place-items: center; color: var(--lime); font-family: var(--pixel); font-size: .67rem; }
    .game-tab[disabled] .tab-icon { color: var(--muted); }
    .game-tab .material-symbols-rounded { overflow: hidden; font-size: 25px; line-height: 1; white-space: nowrap; }
    .tab-copy { display: grid; gap: 3px; }
    .tab-copy strong { font-size: .78rem; line-height: 1.15; text-transform: uppercase; }
    .tab-copy small { color: var(--muted); font-size: .62rem; font-weight: 700; text-transform: uppercase; }

    .game-layout {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 126px minmax(300px, 470px) 126px;
      align-items: start;
      justify-content: center;
      gap: clamp(24px, 5vw, 64px);
      padding: clamp(28px, 5vh, 54px) 0 210px;
    }

    .score-panel, .control-panel { padding-top: 20px; }
    .score-panel .section-label { color: var(--white); }
    .score-list { display: grid; gap: 12px; }

    .score {
      height: 78px;
      display: grid;
      align-content: center;
      gap: 7px;
      padding: 9px 12px;
      border: 2px solid var(--line);
      border-radius: 2px;
      background: var(--raised);
      box-shadow: 4px 4px 0 #07102a;
    }

    .score.x { border-color: var(--lime); box-shadow: 4px 4px 0 var(--lime-dark); }
    .score.o { border-color: var(--amber); box-shadow: 4px 4px 0 var(--amber-dark); }
    .score span { color: var(--white); font-size: .68rem; font-weight: 700; text-transform: uppercase; }
    .score strong { font-family: var(--pixel); font-size: 1.18rem; line-height: 1; }
    .score.x strong { color: var(--lime); }
    .score.o strong { color: var(--amber); }

    .play-area { min-width: 0; text-align: center; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

    .status {
      min-height: 25px;
      margin: 0 0 16px;
      color: var(--lime);
      font-family: var(--pixel);
      font-size: clamp(.68rem, 1.5vw, .9rem);
      line-height: 1.6;
      text-shadow: 2px 2px 0 #233f13;
    }

    .status[data-player="O"] { color: var(--amber); text-shadow: 2px 2px 0 #553313; }
    .status[data-player="draw"] { color: var(--ice); text-shadow: none; }

    .board {
      width: min(100%, 460px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      margin: 0 auto;
      border: 3px solid var(--line);
      border-radius: 2px;
      background: var(--line);
      box-shadow: 6px 6px 0 #08102b;
    }

    .cell {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--raised);
      color: var(--white);
      cursor: pointer;
      font-family: var(--pixel);
      font-size: clamp(2.4rem, 7vw, 4.4rem);
      font-weight: 900;
      line-height: 1;
      text-shadow: 5px 5px 0 #07102a;
      transition: background 160ms ease, color 160ms ease, transform 160ms var(--ease);
    }

    .cell:hover:not(:disabled) { background: var(--raised-hover); box-shadow: inset 0 0 0 3px var(--ice); }
    .cell:active:not(:disabled) { transform: scale(.96); }
    .cell:disabled { cursor: default; }
    .cell.x { --mark: var(--lime); color: var(--lime); }
    .cell.o { --mark: var(--amber); color: var(--amber); }
    .cell.placed { animation: place-mark 220ms var(--ease); }
    .cell.win {
      position: relative;
      z-index: 2;
      background: #294a79;
      box-shadow: inset 0 0 0 4px var(--ice), 0 0 0 3px var(--cabinet);
      animation: pixel-charge 520ms steps(3, end) both;
      animation-delay: calc(var(--win-step, 0) * 90ms);
    }

    .board { position: relative; overflow: hidden; }
    .board.victory::after {
      content: "";
      position: absolute;
      z-index: 4;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background: var(--ice);
      box-shadow: 0 0 0 3px var(--lime), 0 0 12px 4px rgba(185, 237, 43, .72);
      pointer-events: none;
      animation: power-scan 680ms steps(8, end) both;
    }

    .status.victory-message { animation: crt-lock 620ms steps(2, end) both; }

    .hint {
      display: inline-block;
      margin: 23px 0 0;
      border: 2px solid #2a3f73;
      padding: 10px 14px;
      background: var(--raised);
      color: var(--white);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 #07102a;
    }

    .controls { display: grid; gap: 14px; }
    .action {
      min-height: 70px;
      display: grid;
      place-items: center;
      gap: 3px;
      border: 2px solid var(--line);
      border-radius: 2px;
      padding: 7px;
      background: var(--raised);
      color: var(--white);
      cursor: pointer;
      font-size: .7rem;
      font-weight: 700;
      line-height: 1.1;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 #07102a;
      transition: transform 150ms var(--ease), background 150ms ease;
    }

    .action.primary { border-color: var(--lime); color: var(--lime); box-shadow: 4px 4px 0 var(--lime-dark); }
    .action:hover { background: var(--raised-hover); }
    .action:active { transform: translate(4px, 4px); box-shadow: none; }
    .action .material-symbols-rounded { font-size: 30px; }

    .scenery {
      position: absolute;
      z-index: 1;
      left: 0;
      bottom: 0;
      width: 100%;
      height: auto;
      opacity: .96;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .arcade-cabinet.picker-collapsed .game-picker { max-height: 0; overflow: hidden; opacity: 0; padding: 0; border: 0; }

    @keyframes place-mark { from { opacity: .25; transform: scale(.65); } to { opacity: 1; transform: scale(1); } }
    @keyframes pixel-charge {
      0% { color: var(--white); filter: brightness(1); transform: scale(1); }
      40% { color: var(--ice); filter: brightness(1.7); transform: scale(1.04); }
      72% { color: var(--mark); filter: brightness(2); transform: scale(.97); }
      100% { filter: brightness(1.25); transform: scale(1); }
    }
    @keyframes power-scan {
      0% { opacity: 0; transform: translateY(-10px); }
      12% { opacity: 1; }
      88% { opacity: 1; }
      100% { opacity: 0; transform: translateY(460px); }
    }
    @keyframes crt-lock {
      0%, 18%, 38% { opacity: .25; transform: scaleX(.88); filter: brightness(2); }
      10%, 28%, 52% { opacity: 1; transform: scaleX(1.04); }
      100% { opacity: 1; transform: scaleX(1); filter: brightness(1.2); }
    }

    @media (max-width: 850px) {
      .game-layout { grid-template-columns: 110px minmax(270px, 440px) 110px; gap: 18px; padding-bottom: 180px; }
    }

    @media (max-width: 680px) {
      body { padding: 0; }
      .arcade-cabinet { min-height: 100vh; border-width: 0; border-radius: 0; box-shadow: none; }
      .site-header { min-height: 62px; padding: 10px 12px; }
      .brand { font-size: .8rem; }
      .brand::before, .brand::after { margin: 0 5px; }
      .menu-button { width: 42px; height: 42px; flex-basis: 42px; }
      main { padding: 12px 12px 150px; }
      .game-picker { overflow-x: auto; }
      .game-list { min-width: 435px; gap: 8px; }
      .game-tab { min-height: 52px; padding: 6px 8px; }
      .tab-icon { width: 24px; flex-basis: 24px; font-size: .52rem; }
      .tab-copy strong { font-size: .65rem; }
      .tab-copy small { font-size: .52rem; }
      .game-layout { grid-template-columns: 1fr; gap: 18px; padding: 20px 4px 0; }
      .play-area { order: 1; }
      .score-panel { order: 2; padding-top: 0; }
      .control-panel { order: 3; padding-top: 0; }
      .score-list { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .score { height: 66px; padding: 7px; text-align: center; }
      .score span { font-size: .53rem; }
      .score strong { font-size: .9rem; }
      .board { width: min(100%, 440px); }
      .cell { font-size: clamp(2rem, 16vw, 3.6rem); }
      .hint { margin-top: 16px; font-size: .58rem; }
      .controls { grid-template-columns: 1fr 1fr; gap: 10px; }
      .action { min-height: 54px; display: flex; justify-content: center; font-size: .6rem; }
      .action .material-symbols-rounded { font-size: 23px; }
      .scenery { opacity: .78; }
    }

    @media (max-width: 340px) {
      .brand::before, .brand::after { display: none; }
      .tab-copy strong { font-size: .6rem; }
      .cell { font-size: 1.8rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
      .board.victory::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="arcade-cabinet" id="arcade-cabinet">
    <header class="site-header">
      <div class="brand" aria-label="Arcade Break">Arcade Break</div>
      <button class="menu-button" id="menu-button" type="button" aria-label="Toggle game menu" aria-expanded="true" aria-controls="game-picker">
        <span class="material-symbols-rounded" aria-hidden="true">menu</span>
      </button>
    </header>

    <main>
      <nav class="game-picker" id="game-picker" aria-label="Choose a game">
        <p class="section-label">Choose a game</p>
        <ul class="game-list">
          <li><button class="game-tab active" type="button" aria-current="page"><span class="tab-icon" aria-hidden="true">XO</span><span class="tab-copy"><strong>Tic-Tac-Toe</strong><small>Now playing</small></span></button></li>
          <li><button class="game-tab" type="button" disabled><span class="tab-icon material-symbols-rounded" aria-hidden="true">playing_cards</span><span class="tab-copy"><strong>Memory</strong><small>Coming soon</small></span></button></li>
          <li><button class="game-tab" type="button" disabled><span class="tab-icon material-symbols-rounded" aria-hidden="true">pest_control</span><span class="tab-copy"><strong>Snake</strong><small>Coming soon</small></span></button></li>
        </ul>
      </nav>

      <section class="game-layout" aria-labelledby="game-title">
        <aside class="score-panel" aria-label="Scoreboard">
          <p class="section-label">Score</p>
          <div class="score-list">
            <div class="score x"><span>Player X</span><strong id="score-x">0</strong></div>
            <div class="score"><span>Draws</span><strong id="score-draw">0</strong></div>
            <div class="score o"><span>Player O</span><strong id="score-o">0</strong></div>
          </div>
        </aside>

        <div class="play-area">
          <h1 id="game-title">Tic-Tac-Toe</h1>
          <p class="status" id="status" data-player="X" aria-live="polite">X's turn</p>
          <div class="board" role="group" aria-label="Tic-Tac-Toe board">
            <button class="cell" type="button" aria-label="Row 1, column 1, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 1, column 2, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 1, column 3, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 2, column 1, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 2, column 2, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 2, column 3, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 3, column 1, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 3, column 2, empty" data-cell></button>
            <button class="cell" type="button" aria-label="Row 3, column 3, empty" data-cell></button>
          </div>
          <p class="hint">Get three in a row to win!</p>
        </div>

        <aside class="control-panel" aria-label="Game controls">
          <p class="section-label">Controls</p>
          <div class="controls">
            <button class="action primary" type="button" id="restart"><span class="material-symbols-rounded" aria-hidden="true">replay</span>Restart</button>
            <button class="action" type="button" id="reset"><span class="material-symbols-rounded" aria-hidden="true">refresh</span>Reset</button>
          </div>
        </aside>
      </section>
    </main>

    <img class="scenery" src="assets/pocket-pixel-island.png" alt="" aria-hidden="true">
  </div>

  <script>
    const cells = Array.from(document.querySelectorAll("[data-cell]"));
    const statusText = document.querySelector("#status");
    const restartButton = document.querySelector("#restart");
    const resetButton = document.querySelector("#reset");
    const menuButton = document.querySelector("#menu-button");
    const cabinet = document.querySelector("#arcade-cabinet");
    const gameBoard = document.querySelector(".board");
    const scoreX = document.querySelector("#score-x");
    const scoreO = document.querySelector("#score-o");
    const scoreDraw = document.querySelector("#score-draw");
    const winningLines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board = Array(9).fill("");
    let currentPlayer = "X";
    let gameOver = false;
    let scores = { X: 0, O: 0, draw: 0 };

    function updateStatus(message, state) { statusText.textContent = message; statusText.dataset.player = state; }
    function updateScores() { scoreX.textContent = scores.X; scoreO.textContent = scores.O; scoreDraw.textContent = scores.draw; }
    function getWinningLine() { return winningLines.find(line => { const first = board[line[0]]; return first && line.every(index => board[index] === first); }); }

    function endGame(winningLine) {
      gameOver = true;
      if (winningLine) {
        const winner = board[winningLine[0]];
        scores[winner] += 1;
        winningLine.forEach((index, step) => {
          cells[index].classList.add("win");
          cells[index].style.setProperty("--win-step", step);
        });
        gameBoard.classList.add("victory");
        statusText.classList.add("victory-message");
        updateStatus(winner + " wins!", winner);
      } else {
        scores.draw += 1;
        updateStatus("Round draw!", "draw");
      }
      updateScores();
      cells.forEach(cell => { cell.disabled = true; });
    }

    function handleMove(event) {
      const cell = event.currentTarget;
      const index = cells.indexOf(cell);
      if (gameOver || board[index]) return;
      board[index] = currentPlayer;
      cell.textContent = currentPlayer;
      cell.disabled = true;
      cell.classList.add(currentPlayer.toLowerCase(), "placed");
      cell.setAttribute("aria-label", cell.getAttribute("aria-label").replace("empty", "marked " + currentPlayer));
      const winningLine = getWinningLine();
      if (winningLine) return endGame(winningLine);
      if (board.every(Boolean)) return endGame(null);
      currentPlayer = currentPlayer === "X" ? "O" : "X";
      updateStatus(currentPlayer + "'s turn", currentPlayer);
    }

    function startRound() {
      board = Array(9).fill(""); currentPlayer = "X"; gameOver = false; updateStatus("X's turn", "X");
      gameBoard.classList.remove("victory");
      statusText.classList.remove("victory-message");
      cells.forEach((cell, index) => {
        cell.textContent = ""; cell.disabled = false; cell.className = "cell"; cell.style.removeProperty("--win-step");
        cell.setAttribute("aria-label", "Row " + (Math.floor(index / 3) + 1) + ", column " + (index % 3 + 1) + ", empty");
      });
      cells[0].focus();
    }

    function resetMatch() { scores = { X: 0, O: 0, draw: 0 }; updateScores(); startRound(); }
    function toggleMenu() { const collapsed = cabinet.classList.toggle("picker-collapsed"); menuButton.setAttribute("aria-expanded", String(!collapsed)); }
    cells.forEach(cell => cell.addEventListener("click", handleMove));
    restartButton.addEventListener("click", startRound);
    resetButton.addEventListener("click", resetMatch);
    menuButton.addEventListener("click", toggleMenu);
  </script>
</body>
</html>
